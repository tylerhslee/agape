<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agape Studio — execution inspector</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #11151f; --panel2: #161b28; --line: #232a3b;
    --text: #dbe2f0; --dim: #8b94a7; --faint: #5b6478;
    --accent: #7c6cf6; --accent2: #a99df9;
    --green: #34d399; --red: #f87171; --amber: #fbbf24; --cyan: #67e8f9;
    --violet: #c4b5fd; --teal: #5eead4; --orange: #fdba74; --gold: #fde047;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    display: flex; flex-direction: column;
  }

  /* ---- top bar ---- */
  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand b { font-size: 15px; letter-spacing: .2px; }
  .brand .chip {
    font: 10px/1 var(--mono); color: var(--accent2); border: 1px solid var(--accent);
    border-radius: 999px; padding: 3px 8px; opacity: .9;
  }
  .dir { font: 12px var(--mono); color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  header select, header button { flex-shrink: 0; }
  select, button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer;
  }
  button.run {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
    padding: 7px 20px; transition: filter .15s;
  }
  button.run:hover { filter: brightness(1.12); }
  button.run:disabled { opacity: .5; cursor: default; }

  /* ---- layout ---- */
  .body { display: flex; flex: 1; min-height: 0; }
  nav {
    width: 230px; border-right: 1px solid var(--line); background: var(--panel);
    padding: 12px; overflow-y: auto; flex-shrink: 0;
  }
  nav h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--faint); margin: 4px 6px 10px; }
  .prog {
    display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent;
    border-radius: 8px; padding: 8px 10px; color: var(--dim); font: 13px var(--mono); margin-bottom: 2px;
  }
  .prog:hover { background: var(--panel2); color: var(--text); }
  .prog.active { background: var(--panel2); border-color: var(--line); color: var(--text); }
  .prog small { display: block; color: var(--faint); font-size: 10px; margin-top: 2px; }

  main { flex: 1; display: flex; min-width: 0; }
  .col { flex: 1; min-width: 0; overflow-y: auto; padding: 16px; }
  .col.source { border-right: 1px solid var(--line); max-width: 46%; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--faint); margin-bottom: 10px; }

  /* ---- source ---- */
  pre.code {
    font: 12.5px/1.65 var(--mono); white-space: pre-wrap; word-break: break-word; color: #c3ccdf;
  }
  .k  { color: #c792ea; }              /* keywords */
  .t  { color: #82aaff; }              /* types */
  .s  { color: #c3e88d; }              /* strings */
  .c  { color: #546178; font-style: italic; } /* comments */
  .n  { color: #f78c6c; }              /* numbers */

  /* ---- verdict ---- */
  .verdict { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; margin-bottom: 14px; border: 1px solid; }
  .verdict.ok  { background: #0c1f18; border-color: #1d4436; }
  .verdict.bad { background: #241114; border-color: #532a2e; }
  .verdict .light { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .verdict.ok .light  { background: var(--green); box-shadow: 0 0 12px var(--green); }
  .verdict.bad .light { background: var(--red);   box-shadow: 0 0 12px var(--red); }
  .verdict b { font-size: 15px; }
  .verdict .cls { font: 12px var(--mono); border: 1px solid var(--red); color: var(--red); padding: 2px 8px; border-radius: 6px; }
  .verdict .msg { color: var(--dim); font-size: 12.5px; }
  .verdict .head { margin-left: auto; font: 12px var(--mono); color: var(--dim); white-space: nowrap; }
  .verdict .head b { color: var(--green); font: 13px var(--mono); }

  /* ---- kernel chain ---- */
  .chain { display: flex; align-items: center; gap: 0; flex-wrap: wrap; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 10px; min-width: 96px; }
  .stage .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); }
  .stage.lit .dot { background: var(--accent2); box-shadow: 0 0 10px var(--accent); }
  .stage.good .dot { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .stage.warn .dot { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
  .stage .lbl { font-size: 11.5px; color: var(--dim); }
  .stage.lit .lbl, .stage.good .lbl, .stage.warn .lbl { color: var(--text); }
  .stage .sub { font: 10px var(--mono); color: var(--faint); }
  .arrow { color: var(--faint); font-size: 15px; padding: 0 2px; margin-top: -14px; }

  /* ---- timeline ---- */
  .tl { border-left: 2px solid var(--line); margin-left: 8px; padding-left: 0; }
  .ev { display: flex; align-items: baseline; gap: 10px; padding: 5px 4px 5px 14px; position: relative; border-radius: 6px; }
  .ev:hover { background: var(--panel2); }
  .ev::before {
    content: ""; position: absolute; left: -6px; top: 12px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--cat, var(--faint)); border: 2px solid var(--bg);
  }
  .ev .tick { font: 11px var(--mono); color: var(--faint); min-width: 30px; text-align: right; }
  .ev .etype { font: 600 12.5px var(--mono); color: var(--cat, var(--text)); }
  .ev .subj { font: 12px var(--mono); color: var(--dim); }
  .ev .pay { font: 11.5px var(--mono); color: var(--faint); overflow-wrap: anywhere; }
  .ev .tag {
    font: 9px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em;
    color: var(--cat); border: 1px solid var(--cat); border-radius: 4px; padding: 2px 5px; opacity: .8;
  }

  /* ---- console ---- */
  .console { font: 12.5px var(--mono); color: var(--teal); white-space: pre-wrap; }
  .console:empty::after { content: "(no say output)"; color: var(--faint); }

  .empty { color: var(--faint); text-align: center; padding: 60px 20px; font-size: 13px; }
  .meta { font: 11px var(--mono); color: var(--faint); margin-top: 6px; }
</style>
</head>
<body>
<header>
  <div class="brand"><b>Agape Studio</b><span class="chip">execution inspector</span></div>
  <div class="dir" id="dir"></div>
  <select id="provider"></select>
  <button class="run" id="run" disabled>Run ▸</button>
</header>

<div class="body">
  <nav>
    <h3>Programs</h3>
    <div id="programs"></div>
  </nav>
  <main>
    <div class="col source">
      <div class="card"><h2 id="srcTitle">Source</h2><pre class="code" id="source">Select a program.</pre></div>
    </div>
    <div class="col">
      <div id="results"><div class="empty">Run a program to inspect its execution.<br><br>
        Every run is parsed, statically checked (type · trust · color · authority · the gate),
        then executed on the ledger. What you see here is the complete, hash-chained record.</div></div>
    </div>
  </main>
</div>

<script>
const CATS = {
  lifecycle: { color: "var(--cyan)",   types: ["Spawned","AgentAwake","AgentAsleep","AgentCrashed"] },
  message:   { color: "#7dd3fc",       types: ["Sent","Delivered","Resolved","Expired","DeliveryRefused"] },
  gate:      { color: "var(--violet)", types: ["Endorsed","PrincipalDecision"] },
  abstain:   { color: "var(--amber)",  types: ["Abstained","FailedPrincipalDecision"] },
  memory:    { color: "var(--teal)",   types: ["MemoryConsulted","Internalized","Forgotten","ArtifactObserved","QueryResult","DependenceAsserted"] },
  tool:      { color: "var(--orange)", types: ["ToolStarted","ToolResolved"] },
  sensor:    { color: "var(--green)",  types: ["PromptOpened","Prompt"] },
  error:     { color: "var(--red)",    types: ["Error","TypeMismatch","MarginFloorViolation","Contradiction"] },
};

let state = { programs: [], selected: null, meta: {} };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function catOf(etype, map) {
  if (map && map.actions && map.actions.includes(etype)) return { name: "sink", color: "var(--gold)" };
  if (map && map.events && map.events.includes(etype))  return { name: "event", color: "#a7f3d0" };
  for (const [name, c] of Object.entries(CATS)) if (c.types.includes(etype)) return { name, color: c.color };
  return { name: "event", color: "var(--dim)" };
}

function highlight(src) {
  let h = esc(src);
  h = h.replace(/(\/\/[^\n]*)/g, '<span class="c">$1</span>');
  h = h.replace(/(f?&quot;(?:[^&]|&(?!quot;))*?&quot;)/g, '<span class="s">$1</span>');
  h = h.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="n">$1</span>');
  h = h.replace(/\b(agent|enum|struct|action|event|tool|read|write|grants|perform|reach|use|spawn|awake|sleep|crash|on|when|if|else|return|decide|endorse|by|confidence|margin|floor|conformal|readiness|emit|say|mem|forget|quorum|independent|dependent|principal|prompt|instruction|sync|extend|self|true|false|null|abstained|about|as|select|from|where|expires|store)\b/g, '<span class="k">$1</span>');
  h = h.replace(/\b(Credence|Decision|Endorsement|Principal|Entailment|Basis|int|float|bool|text|array)\b/g, '<span class="t">$1</span>');
  return h;
}

async function api(path, opts) { const r = await fetch(path, opts); return r.json(); }

async function init() {
  state.meta = await api("/api/meta");
  $("dir").textContent = state.meta.dir;
  $("provider").innerHTML = state.meta.providers.map((p) => `<option>${p}</option>`).join("");
  const { programs } = await api("/api/programs");
  state.programs = programs;
  $("programs").innerHTML = programs.length
    ? programs.map((p) => `<button class="prog" data-name="${esc(p.name)}">${esc(p.name)}<small>${p.bytes} bytes</small></button>`).join("")
    : `<div class="empty">no .ag programs here</div>`;
  for (const b of document.querySelectorAll(".prog")) b.onclick = () => select(b.dataset.name);
  if (programs.length) select(programs[0].name);
}

async function select(name) {
  state.selected = name;
  for (const b of document.querySelectorAll(".prog")) b.classList.toggle("active", b.dataset.name === name);
  $("srcTitle").textContent = name;
  const { source } = await api(`/api/source?name=${encodeURIComponent(name)}`);
  $("source").innerHTML = highlight(source);
  $("run").disabled = false;
  $("results").innerHTML = `<div class="empty">Press Run to execute <b>${esc(name)}</b> and inspect the ledger.</div>`;
}

$("run").onclick = async () => {
  if (!state.selected) return;
  $("run").disabled = true; $("run").textContent = "Running…";
  try {
    const r = await api("/api/run", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ program: state.selected, provider: $("provider").value }),
    });
    render(r);
  } finally { $("run").disabled = false; $("run").textContent = "Run ▸"; }
};

function render(r) {
  const out = [];

  // verdict
  if (r.ok) {
    out.push(`<div class="verdict ok"><div class="light"></div><b>Accepted &amp; executed</b>
      <span class="msg">${r.events.length} ledger events · ${r.ms} ms · provider ${esc(r.provider.backend)}</span>
      <span class="head">chain-head <b>${esc(r.chainHead)}</b></span></div>`);
  } else {
    out.push(`<div class="verdict bad"><div class="light"></div><b>Rejected</b>
      <span class="cls">${esc(r.error.cls)}</span>
      <span class="msg">${esc(r.error.message)}</span></div>`);
  }

  // kernel chain
  const ev = r.events || [];
  const has = (t) => ev.some((e) => e.etype === t);
  const count = (t) => ev.filter((e) => e.etype === t).length;
  const sinks = r.map ? ev.filter((e) => r.map.actions.includes(e.etype)) : [];
  const stages = [
    { lbl: "Testimony", cls: has("Resolved") ? "lit" : "", sub: `${count("Resolved")} resolved` },
    { lbl: "Credence", cls: has("Resolved") ? "lit" : "", sub: "graded (in-memory)" },
    { lbl: "Decision", cls: (has("Endorsed") || has("Abstained") || has("PrincipalDecision")) ? "lit" : "", sub: "sealed (in-memory)" },
    { lbl: "Endorsement", cls: has("Endorsed") ? "good" : has("Abstained") ? "warn" : "", sub: has("Endorsed") ? `${count("Endorsed")} endorsed` : has("Abstained") ? "abstained" : "—" },
    { lbl: "Sink", cls: sinks.length ? "good" : "", sub: sinks.length ? sinks.map((s) => s.etype).join(", ") : "no consequential act" },
    { lbl: "Ledger", cls: r.ok ? "lit" : "", sub: r.ok ? esc(r.chainHead) : "—" },
  ];
  out.push(`<div class="card"><h2>Trusted-kernel chain</h2><div class="chain">${
    stages.map((s, i) => `${i ? '<div class="arrow">→</div>' : ""}<div class="stage ${s.cls}"><div class="dot"></div><div class="lbl">${s.lbl}</div><div class="sub">${s.sub}</div></div>`).join("")
  }</div></div>`);

  // timeline
  if (ev.length) {
    out.push(`<div class="card"><h2>Ledger timeline — ${ev.length} events</h2><div class="tl">${
      ev.map((e) => {
        const c = catOf(e.etype, r.map);
        const pay = e.payload === undefined || e.payload === null ? "" : esc(JSON.stringify(e.payload));
        return `<div class="ev" style="--cat:${c.color}"><span class="tick">${e.tick}</span>
          <span class="etype">${esc(e.etype)}</span><span class="subj">${esc(e.subject ?? "")}</span>
          <span class="tag">${c.name}</span><span class="pay">${pay}</span></div>`;
      }).join("")
    }</div><div class="meta">every event is hash-chained; the chain-head is the proof of replay-equivalence (T4)</div></div>`);
  }

  // say console
  if (r.ok) {
    out.push(`<div class="card"><h2>say output</h2><div class="console">${esc((r.stdout || []).join("\n"))}</div></div>`);
  }

  $("results").innerHTML = out.join("");
}

init();
</script>
</body>
</html>
