section = "00_lexical"
path = "tests/00_lexical/lex_reject_right_arrow.ag"
expect = "reject"
error = "LexError"
spec = "§2 (exactly one communication arrow `<-`; `->` is a LexError)"
note = "the retired `->` does not lex."

[[test]]
