section = "00_lexical"
path = "tests/00_lexical/lex_contextual_word_as_identifier.ag"
expect = "accept"
spec = "§2 (contextual words `as`/`by`/`reach`/`use`/`origin` lex as identifiers out of position)"
note = "`by` outside a gate position is an ordinary identifier."

[[test]]
id = "lex_reject_keyword_as_identifier"
section = "00_lexical"
path = "tests/00_lexical/lex_reject_keyword_as_identifier.ag"
expect = "reject"
error = "ParseError"
spec = "§2 (reserved keywords may not be used as identifiers)"
note = "`agent` is reserved."

[[test]]
id = "lex_reject_missing_semicolon"
section = "00_lexical"
path = "tests/00_lexical/lex_reject_missing_semicolon.ag"
