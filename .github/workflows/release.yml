name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  bundle:
    name: bundle + production conformance (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Package the bundle
        run: bash scripts/package.sh

      - name: Install production-conformance runner
        working-directory: agape-production-conformance
        run: npm ci --no-audit --no-fund

      - name: Extract bundle and select native launcher
        run: |
          set -euo pipefail
          archive="$(find dist -maxdepth 1 -type f -name 'agape-*.tar.gz' | head -n 1)"
          test -n "$archive"
          extract="$RUNNER_TEMP/agape-production-bundle"
          rm -rf "$extract"
          mkdir -p "$extract"
          tar -xzf "$archive" -C "$extract"
          bundle="$(find "$extract" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$bundle"
          case "$RUNNER_OS" in
            Linux) os=linux; launcher="$bundle/bin/agape" ;;
            macOS) os=macos; launcher="$bundle/bin/agape" ;;
            Windows) os=windows; launcher="$(cygpath -am "$bundle/bin/agape.cmd")" ;;
            *) echo "unsupported RUNNER_OS=$RUNNER_OS" >&2; exit 1 ;;
          esac
          echo "AGAPE_CONFORMANCE_OS=$os" >> "$GITHUB_ENV"
          echo "AGAPE_PRODUCTION_BIN=$launcher" >> "$GITHUB_ENV"

      - name: Packaged production conformance (full allocation)
        working-directory: agape-production-conformance
        run: npm run test:allocated -- --target package --os "$AGAPE_CONFORMANCE_OS" --lane full

      - name: Packaged production conformance (transition smoke allocation)
        working-directory: agape-production-conformance
        run: npm run test:allocated -- --target package --os "$AGAPE_CONFORMANCE_OS" --lane smoke

      - name: Upload verified bundle
        uses: actions/upload-artifact@v4
        with:
          name: agape-bundle-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish verified release
    needs: bundle
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agape-bundle-*
          path: dist
          merge-multiple: true
      - name: Attach all verified bundles to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
