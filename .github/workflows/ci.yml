name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── the language: compiler + runtime + the conformance suite ──────────────
  agape-rs:
    name: agape-rs (build · test · conformance)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agape-rs
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agape-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('agape-rs/Cargo.lock', 'agape-rs/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build
        run: cargo build --all-targets

      - name: Unit tests
        run: cargo test

      # The conformance binary exits with the number of failing tests, so a
      # non-zero exit fails the job — this is the gate that the language stays
      # at full v1.0 conformance.
      - name: Conformance suite (must be 102/102)
        run: cargo run --quiet --bin conformance

      # Style is informative, never blocking — CI must not pressure the
      # implementation into changes (see the CI/CD ground rule).
      - name: rustfmt (informational)
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: clippy (informational)
        run: cargo clippy --all-targets -- -W clippy::all
        continue-on-error: true

  # ── the conformance manifests stay in lockstep with the .ag sources ───────
  manifests:
    name: conformance manifests in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Rebuild manifests and check for drift
        working-directory: agape-conformance
        run: |
          python3 build_manifests.py
          if ! git diff --quiet; then
            echo "::error::MANIFEST.toml / MANIFEST.md are stale — run build_manifests.py and commit."
            git --no-pager diff --stat
            exit 1
          fi

  # ── the studio: test (unit + integration) → build → run the bundle path ───
  studio:
    name: studio (test · build · run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          (cd studio/web && npm install --no-audit --no-fund)
          (cd studio/agent-server && npm install --no-audit --no-fund)

      # The integration tests boot the backend, which runs projects through the binary.
      - name: Build the agape binary
        run: cargo build --manifest-path agape-rs/Cargo.toml --bin agape

      - name: Test — agent-server (unit + integration)
        run: cd studio/agent-server && npx vitest run --reporter=default --reporter=junit --outputFile=../../test-results/agent-server.xml

      - name: Test — web (components)
        run: cd studio/web && npx vitest run --reporter=default --reporter=junit --outputFile=../../test-results/web.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-test-results
          path: test-results/*.xml
          if-no-files-found: ignore

      - name: Build the web app
        working-directory: studio/web
        run: npm run build

      # End-to-end on the SHIPPED bundle path: serve the built app + run a project.
      - name: Studio bundle smoke test
        run: bash scripts/studio-smoke.sh

  # ── E2E: a real browser drives the marquee user flow against the real studio ─
  e2e:
    name: studio E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          (cd studio/web && npm install --no-audit --no-fund)
          (cd studio/agent-server && npm install --no-audit --no-fund)

      - name: Build the agape binary + the web app
        run: |
          cargo build --manifest-path agape-rs/Cargo.toml --bin agape
          (cd studio/web && npm run build)

      - name: Install Playwright (chromium + system deps)
        working-directory: studio/web
        run: npx playwright install --with-deps chromium

      - name: Run E2E (Playwright drives the served app + the real backend)
        working-directory: studio/web
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: studio/web/playwright-report
          if-no-files-found: ignore
