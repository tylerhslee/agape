name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: version references in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check VERSION.md against tracked references
        run: node scripts/check-version.mjs

  # ── the language: TypeScript compiler + runtime + the conformance suite ────
  agape-ts:
    name: agape-ts (typecheck · test · conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agape-ts/package-lock.json

      - name: Install deps
        working-directory: agape-ts
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: agape-ts
        run: npm run typecheck

      - name: Unit tests
        working-directory: agape-ts
        run: npm test

      # The runner exits nonzero when any conformance test fails — the gate
      # that the language stays at full conformance at the toolchain's version.
      - name: Conformance suite (zero failures)
        working-directory: agape-ts
        run: npx tsx conformance/run.mts

      # Black-box runtime-contract tests (SPEC §16–§17). Blocking run without an
      # adapter: the suite skips every case, proving the harness itself is green.
      - name: Runtime-contract conformance (adapter-less skip)
        working-directory: agape-runtime-conformance
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx vitest run

      # Non-blocking run against the agape-ts adapter (33/35 pass). Two cases
      # fail on documented kernel gaps: 16_4 MarginFloorViolation is never
      # emitted (§16.6) and 16_8 warm conformal prediction sets are
      # unimplemented (§15.5.6). Kept non-blocking until those land.
      - name: Runtime-contract conformance (agape-ts adapter)
        working-directory: agape-runtime-conformance
        continue-on-error: true
        run: npm run test:agape-ts

  # ── the conformance manifests stay in lockstep with the .ag sources ───────
  manifests:
    name: conformance manifests in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Rebuild manifests and check for drift
        working-directory: agape-conformance
        run: |
          python3 build_manifests.py
          if ! git diff --quiet; then
            echo "::error::MANIFEST.toml / MANIFEST.md are stale — run build_manifests.py and commit."
            git --no-pager diff --stat
            exit 1
          fi

  # ── the studio: test (unit + integration) → build → run the bundle path ───
  studio:
    name: studio (test · build · run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The smoke test runs projects through the agape-ts CLI, so its deps
      # (tsx) must be installed alongside the studio packages.
      - name: Install deps
        run: |
          (cd agape-ts && npm ci --no-audit --no-fund)
          (cd studio/web && npm install --no-audit --no-fund)
          (cd studio/agent-server && npm install --no-audit --no-fund)

      - name: Test — agent-server (unit + integration)
        run: cd studio/agent-server && npx vitest run --reporter=default --reporter=junit --outputFile=../../test-results/agent-server.xml

      - name: Test — web (components)
        run: cd studio/web && npx vitest run --reporter=default --reporter=junit --outputFile=../../test-results/web.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-test-results
          path: test-results/*.xml
          if-no-files-found: ignore

      - name: Build the web app
        working-directory: studio/web
        run: npm run build

      # End-to-end on the SHIPPED bundle path: serve the built app + run a project.
      - name: Studio bundle smoke test
        run: bash scripts/studio-smoke.sh

  # ── E2E: a real browser drives the marquee user flow against the real studio ─
  e2e:
    name: studio E2E (Playwright)
    runs-on: ubuntu-latest
    # e2e spec targets the old rail UI — non-blocking until the spec is rewritten for the new shell (tracked).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The E2E server launcher runs projects through the agape-ts CLI.
      - name: Install deps
        run: |
          (cd agape-ts && npm ci --no-audit --no-fund)
          (cd studio/web && npm install --no-audit --no-fund)
          (cd studio/agent-server && npm install --no-audit --no-fund)

      - name: Build the web app
        working-directory: studio/web
        run: npm run build

      - name: Install Playwright (chromium + system deps)
        working-directory: studio/web
        run: npx playwright install --with-deps chromium

      - name: Run E2E (Playwright drives the served app + the real backend)
        working-directory: studio/web
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: studio/web/playwright-report
          if-no-files-found: ignore
